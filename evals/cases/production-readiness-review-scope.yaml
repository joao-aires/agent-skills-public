description: production-readiness-review-scope
metadata:
  gate: nightly
  stage: operations
  kind: review
vars:
  id: production-readiness-review-scope
  prompt: |
    The service launches in two days. Given the evidence in docs/evidence/, write a scoped
    go/no-go readiness verdict to docs/review/readiness.md with the headings "Verdict" and
    "Gaps". Cover the restore, alert, ownership and rollback gaps. Name the decision owner
    and the evidence that would change the verdict. Do not deploy or authorize deployment.
  fixture: fixtures/readiness-service
  timeout_sec: 600
  expect:
    exit: 0
    headings:
      docs/review/readiness.md: [Verdict, Gaps]
    files:
      contains:
        docs/review/readiness.md: [restore, alert, owner, rollback]
      not_contains:
        docs/review/readiness.md: [deployment approved, cleared to deploy]
    diff:
      max_files: 2
      allowed: [docs/review/]
  judge:
    rubric: Readiness evidence is separated from release authorization, and recovery and alert ownership remain material gaps.
assert:
  - type: javascript
    value: file://assertions/contract.mjs
