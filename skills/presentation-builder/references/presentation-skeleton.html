<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESENTATION_TITLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* ── Reset & Base ───────────────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --bg: #0a0a12;
            --surface: #12121e;
            --surface-alt: #181828;
            --border: #1e1e30;
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --accent: #4ecdc4;
            --accent-dim: rgba(78, 205, 196, .15);
            --red: #ff6b6b;
            --yellow: #ffd93d;
            --purple: #a78bfa;
            --blue: #60a5fa;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html {
            scroll-behavior: smooth;
            font-size: clamp(16px, 1.4vw, 28px)
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ── Slide Counter ──────────────────────────────────── */
        .slide-counter {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            font-family: var(--font-mono);
            font-size: clamp(.6rem, .75vw, .85rem);
            color: var(--text-muted);
            z-index: 100;
            background: rgba(10, 10, 18, .7);
            padding: .25rem .5rem;
            border-radius: 4px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
        }

        /* ── Scene (each slide) ─────────────────────────────── */
        .scene {
            min-height: 100vh;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2rem, 3vh, 4rem) clamp(2rem, 4vw, 5rem);
            position: relative;
            overflow: hidden;
        }

        .scene-inner {
            max-width: clamp(700px, 74vw, 1400px);
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .scene-inner::-webkit-scrollbar {
            display: none
        }

        .scene.fit-wide .scene-inner.is-fitted {
            max-height: none;
            overflow-y: visible;
            transform: scale(var(--fit-scale, 1));
            transform-origin: top left;
            width: calc(100% / var(--fit-scale, 1));
        }

        /* ── fullscreen-balanced ────────────────────────────── */
        @media (min-width: 1000px) and (min-aspect-ratio: 4/3) {
            .scene.fullscreen-balanced .scene-inner {
                display: flex;
                flex-direction: column;
            }

            .scene.fullscreen-balanced h3 {
                flex-shrink: 0;
            }

            .scene.fullscreen-balanced .card-grid {
                flex: 1;
                align-content: stretch;
            }
        }

        /* ── Typography ─────────────────────────────────────── */
        h1 {
            font-size: clamp(2.4rem, 4.5vw, 5rem);
            font-weight: 700;
            letter-spacing: -.03em;
            line-height: 1.15
        }

        h2 {
            font-size: clamp(1.5rem, 2.8vw, 3.2rem);
            font-weight: 600;
            letter-spacing: -.02em;
            line-height: 1.2;
            margin-bottom: clamp(.5rem, 1.2vh, 1.2rem)
        }

        h3 {
            font-weight: 500;
            color: var(--accent);
            margin-bottom: .8rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: clamp(.7rem, 1vw, 1.1rem)
        }

        .subtitle {
            font-size: clamp(1rem, 1.8vw, 1.8rem);
            color: var(--text-muted);
            margin-top: 1rem;
            font-weight: 300
        }

        .tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: clamp(.6rem, .85vw, .95rem);
            padding: .2rem .5rem;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--accent);
            margin-bottom: 1rem;
            letter-spacing: .04em;
        }

        /* ── Bullet Lists ───────────────────────────────────── */
        .bullet-list {
            list-style: none;
            padding: 0;
            margin: clamp(.4rem, .8vh, .8rem) 0
        }

        .bullet-list li {
            position: relative;
            padding-left: 1.4rem;
            margin-bottom: clamp(.35rem, .7vh, .7rem);
            color: var(--text);
            font-size: clamp(.88rem, 1.3vw, 1.4rem);
        }

        .bullet-list li::before {
            content: '›';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 600
        }

        .bullet-list li strong {
            color: var(--accent)
        }

        .bullet-list .sub {
            list-style: none;
            padding: 0;
            margin: .3rem 0 .3rem 1.4rem
        }

        .bullet-list .sub li {
            font-size: clamp(.82rem, 1.15vw, 1.25rem);
            margin-bottom: .3rem;
            color: var(--text-muted)
        }

        .bullet-list .sub li::before {
            content: '–';
            color: var(--text-muted)
        }

        /* ── Cards ──────────────────────────────────────────── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(clamp(200px, 18vw, 300px), 1fr));
            gap: clamp(.8rem, 1.2vw, 1.5rem);
            margin-top: 1rem
        }

        .card {
            background: rgba(255, 255, 255, .02);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 12px;
            padding: clamp(.7rem, 1vw, 1.2rem);
            transition: border-color .25s ease, transform .25s ease, background .25s ease;
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
            gap: clamp(.2rem, .38vw, .45rem);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, .14);
            z-index: 5;
        }

        .card h4 {
            font-size: clamp(.82rem, 1.04vw, 1.16rem);
            font-weight: 600;
            margin-bottom: .2rem
        }

        .card p,
        .card ul {
            font-size: clamp(.76rem, .96vw, 1rem);
            color: var(--text-muted);
            line-height: 1.42
        }

        .card p strong,
        .card ul strong {
            color: var(--text);
        }

        .card ul {
            list-style: none;
            padding: 0
        }

        .card ul li {
            padding-left: 1rem;
            position: relative;
            margin-bottom: .2rem;
            line-height: 1.38;
        }

        .card ul li:last-child {
            margin-bottom: 0;
        }

        .card ul li::before {
            content: '›';
            position: absolute;
            left: 0;
            font-weight: 600;
            color: var(--accent)
        }

        /* ── Pillar Cards ───────────────────────────────────── */
        .pillar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(.5rem, 1vw, 1.2rem);
            margin-top: clamp(.5rem, .8vw, 1rem);
        }

        .pillar-card {
            background: rgba(255, 255, 255, .02);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 12px;
            padding: clamp(.5rem, 1vw, 1.2rem);
            display: flex;
            flex-direction: column;
            gap: clamp(.25rem, .5vw, .6rem);
        }

        .pillar-card-header {
            display: flex;
            align-items: center;
            gap: clamp(.25rem, .5vw, .6rem);
        }

        .pillar-card-header h4 {
            font-size: clamp(.82rem, 1.08vw, 1.2rem);
            font-weight: 600;
        }

        .pillar-subtitle {
            font-size: clamp(.62rem, .82vw, .95rem);
            color: var(--text-muted);
            font-style: italic;
            margin-top: -.1rem;
        }

        .pillar-items {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(.16rem, .3vw, .38rem);
        }

        .pillar-items li {
            font-size: clamp(.7rem, .92vw, 1.05rem);
            color: var(--text-muted);
            padding-left: 1rem;
            position: relative;
            line-height: 1.38;
        }

        .pillar-items li::before {
            content: '›';
            position: absolute;
            left: 0;
            font-weight: 600;
            color: var(--accent);
        }

        .pillar-items li strong {
            color: var(--text);
        }

        /* ── Event slides ───────────────────────────────────── */
        .event-slide {
            display: flex;
            gap: clamp(1rem, 2vw, 2rem);
            align-items: flex-start;
        }

        .event-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: .45rem;
            gap: 0;
            flex-shrink: 0;
        }

        .edot {
            width: clamp(12px, 1.2vw, 18px);
            height: clamp(12px, 1.2vw, 18px);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .eline {
            width: 2px;
            flex: 1;
            min-height: clamp(80px, 12vh, 200px);
            opacity: .3;
        }

        .event-body .year {
            display: block;
            font-family: var(--font-mono);
            font-size: clamp(.65rem, .85vw, .95rem);
            color: var(--text-muted);
            margin-bottom: .3rem;
            letter-spacing: .02em;
        }

        .event-img {
            margin-top: clamp(.6rem, 1vh, 1rem);
            max-width: min(100%, clamp(400px, 35vw, 600px));
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        /* ── Reveal Animations ──────────────────────────────── */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity .6s ease, transform .6s ease
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0)
        }

        .reveal-stagger>* {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .45s ease, transform .45s ease
        }

        .reveal-stagger.visible>* {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-stagger.visible>*:nth-child(1) { transition-delay: .04s }
        .reveal-stagger.visible>*:nth-child(2) { transition-delay: .1s }
        .reveal-stagger.visible>*:nth-child(3) { transition-delay: .16s }
        .reveal-stagger.visible>*:nth-child(4) { transition-delay: .22s }
        .reveal-stagger.visible>*:nth-child(5) { transition-delay: .28s }
        .reveal-stagger.visible>*:nth-child(6) { transition-delay: .34s }

        /* ── Special Slides ─────────────────────────────────── */
        .title-slide h1 .accent {
            color: var(--accent)
        }

        .title-slide .meta {
            margin-top: 1.5rem;
            font-size: clamp(.78rem, 1vw, 1.1rem);
            color: var(--text-muted)
        }

        .qa-slide {
            text-align: center
        }

        .qa-slide h2 {
            font-size: clamp(2.2rem, 4.5vw, 5rem);
            margin-bottom: .8rem
        }

        .qa-slide p {
            font-size: clamp(.9rem, 1.3vw, 1.4rem);
            color: var(--text-muted)
        }

        /* ── Responsive ─────────────────────────────────────── */
        @media(max-width:700px) {
            .scene { padding: 2rem 1.25rem }
            .slide-counter { right: 1rem }
            .card-grid { grid-template-columns: 1fr }
            .event-slide { flex-direction: column; gap: .8rem }
        }

        /* ── ADD SLIDE-SPECIFIC CSS HERE ────────────────────── */

    </style>
</head>

<body>

    <!-- Slide Counter -->
    <div class="slide-counter" id="slideCounter">1 / 1</div>

    <!-- ================================================================
     1 · TITLE
     ================================================================ -->
    <section class="scene" id="s-title">
        <div class="scene-inner title-slide reveal">
            <span class="tag">EVENT_TAG · DATE</span>
            <h1>PRESENTATION_TITLE</h1>
            <p class="subtitle">SUBTITLE</p>
            <div class="meta">AUTHOR · ROLE</div>
        </div>
    </section>

    <!-- ================================================================
     ADD SLIDES HERE
     ================================================================ -->

    <!-- ================================================================
     N · CLOSING
     ================================================================ -->
    <section class="scene" id="s-closing">
        <div class="scene-inner qa-slide reveal">
            <h2>QA</h2>
            <p style="margin-bottom:1rem;font-size:clamp(.95rem,1.2vw,1.35rem);color:var(--text-muted)">Thank you!</p>
        </div>
    </section>

    <!-- ════════════════════════════════════════════════════════
     SCRIPTS
     ════════════════════════════════════════════════════════ -->
    <script>
        (function () {
            const scenes = Array.from(document.querySelectorAll('.scene'));
            const counter = document.getElementById('slideCounter');
            const total = scenes.length;

            /* ── Fit-wide auto-scaling ─────────────────────── */
            function fitWideSlides() {
                const wideEnough = window.innerWidth >= 1440 && window.innerWidth / window.innerHeight >= 1.55;
                document.querySelectorAll('.scene.fit-wide .scene-inner').forEach(inner => {
                    inner.classList.remove('is-fitted');
                    inner.style.removeProperty('--fit-scale');
                    if (!wideEnough) return;
                    const availableHeight = window.innerHeight * 0.9;
                    const contentHeight = inner.scrollHeight;
                    if (contentHeight <= availableHeight) return;
                    const scale = Math.max(0.82, Math.min(1, availableHeight / contentHeight));
                    if (scale < 0.999) {
                        inner.style.setProperty('--fit-scale', scale.toFixed(4));
                        inner.classList.add('is-fitted');
                    }
                });
            }

            /* ── Fullscreen toggle ─────────────────────────── */
            function getFullscreenElement() {
                return document.fullscreenElement || document.webkitFullscreenElement || null;
            }

            function toggleFullscreen() {
                if (!getFullscreenElement()) {
                    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
                } else {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                }
            }

            window.addEventListener('resize', fitWideSlides);
            document.addEventListener('fullscreenchange', fitWideSlides);
            document.addEventListener('webkitfullscreenchange', fitWideSlides);
            fitWideSlides();

            /* ── Slide tracking ────────────────────────────── */
            function getActiveScene() {
                let idx = 0;
                const mid = window.innerHeight / 2;
                scenes.forEach((s, i) => {
                    if (s.getBoundingClientRect().top <= mid) idx = i;
                });
                return idx;
            }

            function update() {
                const idx = getActiveScene();
                counter.textContent = (idx + 1) + ' / ' + total;
            }

            window.addEventListener('scroll', update, { passive: true });
            update();

            /* ── Reveal on scroll ──────────────────────────── */
            const io = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.12 });
            document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => io.observe(el));

            /* ── Keyboard navigation ───────────────────────── */
            document.addEventListener('keydown', e => {
                const nav = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft', 'f', 'F'];
                if (!nav.includes(e.key)) return;
                e.preventDefault();
                const cur = getActiveScene();
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    if (cur < total - 1) scenes[cur + 1].scrollIntoView({ behavior: 'smooth' });
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    if (cur > 0) scenes[cur - 1].scrollIntoView({ behavior: 'smooth' });
                } else {
                    toggleFullscreen();
                }
            });
        })();
    </script>
</body>

</html>
