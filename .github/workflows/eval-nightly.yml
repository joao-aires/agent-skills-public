name: Evals / nightly

# Manual or scheduled only. No model runs on pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
permissions:
  contents: read
concurrency:
  group: evals-nightly
  cancel-in-progress: false
jobs:
  eval:
    name: Deterministic nightly suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Install the pinned OpenCode CLI
        run: npm install -g @opencode/cli@2.3.0
      - name: Install the pinned eval harness
        run: npm ci --prefix evals --no-audit --no-fund
      - name: Record the OpenCode version
        run: opencode --version
      - name: Build the bundle under test
        run: python scripts/build_plugins.py --plugin sdlc --destination "$RUNNER_TEMP/bundle"
      - name: Seed the provider data home
        env:
          OPENCODE_DATA_ARCHIVE: ${{ secrets.OPENCODE_DATA_ARCHIVE }}
        run: |
          if [ -z "$OPENCODE_DATA_ARCHIVE" ]; then
            echo "::error::OPENCODE_DATA_ARCHIVE is required. A fresh XDG_DATA_HOME fails provider.no-route."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/opencode-data"
          printf '%s' "$OPENCODE_DATA_ARCHIVE" | base64 -d | tar -xz -C "$RUNNER_TEMP/opencode-data"
      - name: Run the nightly suite
        env:
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          OPENCODE_DATA_HOME: ${{ runner.temp }}/opencode-data
          EVAL_SKILLS_DIR: ${{ runner.temp }}/bundle
          EVAL_BUILD: ${{ github.sha }}
          EVAL_CONCURRENCY: '2'
        run: npm --prefix evals run eval:nightly
      - name: Upload eval records and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-nightly
          path: evals/.runs/
          retention-days: 7
          if-no-files-found: warn
