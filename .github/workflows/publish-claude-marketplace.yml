name: Publish / Plugin marketplaces
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-claude-marketplace
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  publish:
    name: Publish validated Claude Code and Codex catalogs
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Build every pinned plugin
        run: python scripts/build_plugins.py --all --destination "$RUNNER_TEMP/marketplace"
      - name: Check complete inventory and local resources
        run: python scripts/check_collection.py --built "$RUNNER_TEMP/marketplace"
      - name: Add the Claude Code and Codex marketplace manifests
        run: python scripts/build_plugin_marketplaces.py --built "$RUNNER_TEMP/marketplace"
      - name: Publish generated output
        working-directory: ${{ runner.temp }}/marketplace
        run: |
          git init -q -b claude-marketplace
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin refs/heads/claude-marketplace > /dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin refs/heads/claude-marketplace:refs/remotes/origin/claude-marketplace
            git fetch --no-tags "$GITHUB_WORKSPACE" refs/remotes/origin/claude-marketplace
            git reset --soft FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          git add -A
          if git diff --cached --quiet HEAD 2>/dev/null; then exit 0; fi
          git commit -q -m "build: plugin marketplaces from ${GITHUB_SHA}"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags "$PWD" refs/heads/claude-marketplace
          git -C "$GITHUB_WORKSPACE" push origin FETCH_HEAD:refs/heads/claude-marketplace
