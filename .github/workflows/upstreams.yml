name: CI / Upstream maintenance
on:
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Optional artifact ID; supply its accepted candidate commit too'
        type: string
      commit:
        description: 'Optional full candidate commit SHA'
        type: string
permissions:
  contents: read
concurrency:
  group: upstream-snapshot-maintenance
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent-depot
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Prepare exact candidates
        id: candidate
        env:
          UPDATE_ARTIFACT: ${{ inputs.artifact }}
          UPDATE_COMMIT: ${{ inputs.commit }}
        run: node scripts/prepare_upstream_update.mjs
      - name: Verify snapshots and effective packages
        if: steps.candidate.outputs.changed == 'true'
        run: |
          node .agent-depot/tool/dist/cli.js --json verify
          node --test tests/upstream_update.test.mjs
          python scripts/validate_plugins.py
          python scripts/validate_evaluations.py
          python -m unittest discover -s tests -v
          python scripts/build_plugins.py --all --destination "$RUNNER_TEMP/upstream-plugins"
          python scripts/check_collection.py --built "$RUNNER_TEMP/upstream-plugins"
      - name: Publish the review candidate
        if: steps.candidate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/upstream-snapshots
          base: main
          title: 'chore(upstreams): update accepted skill snapshots'
          commit-message: 'chore(upstreams): update accepted skill snapshots'
          body-path: ${{ runner.temp }}/upstream-update.md
          add-paths: |
            agent-depot.json
            agent-depot.lock.json
            plugins/**
      - name: Retain discovery and exact plans
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-review
          path: |
            ${{ runner.temp }}/upstream-discovery.json
            ${{ runner.temp }}/upstream-plan.json
          if-no-files-found: ignore
