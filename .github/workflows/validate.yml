name: CI / Plugins
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Validate plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-agent-depot
      - name: Verify committed upstream snapshots offline
        run: node .agent-depot/tool/dist/cli.js --json verify
      - name: Test upstream maintenance automation
        run: node --test tests/upstream_update.test.mjs
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate plugin packages
        run: python scripts/validate_plugins.py
      - name: Run packaging regression tests
        run: python -m unittest discover -s tests -v
      - name: Check documentation links and skill names
        run: python scripts/check_collection.py
      - name: Build every pinned plugin
        run: >-
          python scripts/build_plugins.py
          --all
          --destination "$RUNNER_TEMP/built-plugins"
      - name: Check complete inventory and local resources
        run: python scripts/check_collection.py --built "$RUNNER_TEMP/built-plugins"
      - name: Generate Claude Code and Codex marketplace manifests
        run: python scripts/build_plugin_marketplaces.py --built "$RUNNER_TEMP/built-plugins"
      - name: Check workflow-only default build
        run: |
          python scripts/build_plugins.py --destination "$RUNNER_TEMP/default-plugins"
          python scripts/check_collection.py --built "$RUNNER_TEMP/default-plugins" --plugin development
      - name: Build and check each plugin independently
        run: |
          for manifest in plugins/*/plugin.json; do
            plugin_name="$(basename "$(dirname "$manifest")")"
            python scripts/build_plugins.py --plugin "$plugin_name" --destination "$RUNNER_TEMP/independent/$plugin_name"
            python scripts/check_collection.py --built "$RUNNER_TEMP/independent/$plugin_name" --plugin "$plugin_name"
          done
      - name: Check system flow explorer
        run: python plugins/visualization/skills/system-flow-explorer/scripts/smoke_test.py
