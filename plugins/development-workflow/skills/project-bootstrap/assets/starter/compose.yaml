services:
  database:
    image: postgres:17.11
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
      POSTGRES_DB: notes
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["notes-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  notes-data:
