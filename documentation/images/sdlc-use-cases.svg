<rect x="1244" y="294" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="1377.5" y="331" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Review the increment</text>
