<path d="M937 448 H950" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="956" y="418" width="267" height="60" rx="9" fill="#e7f3ef" stroke="#e7f3ef"/>
<text x="1089.5" y="455" font-size="20" fill="#157466" font-weight="550" text-anchor="middle" >Repair ↔ verify</text>
<path d="M1225 448 H1238" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1244" y="418" width="267" height="60" rx="9" fill="#e7f3ef" stroke="#e7f3ef"/>
<text x="1377.5" y="455" font-size="20" fill="#157466" font-weight="550" text-anchor="middle" >Retain regression tests</text>
<rect x="44" y="517" width="1512" height="108" rx="12" fill="white" stroke="#c5d2df"/>
<text x="66" y="555" font-size="24" fill="#172c41" font-weight="700" text-anchor="start" >A scoped assessment</text>
<g data-skill="true" data-use="direct"><rect x="58" y="566.0" width="280" height="34" rx="5" fill="#e7f3ef" stroke="#a4c9b4"/><text x="66" y="592" font-size="20" fill="#176044" font-weight="400" text-anchor="start" >review / test</text></g>
