<text x="66" y="431" font-size="24" fill="#172c41" font-weight="700" text-anchor="start" >A bug or regression</text>
<g data-skill="true" data-use="direct"><rect x="58" y="442.0" width="280" height="34" rx="5" fill="#e7f3ef" stroke="#a4c9b4"/><text x="66" y="468" font-size="20" fill="#176044" font-weight="400" text-anchor="start" >improve / implement</text></g>
<rect x="380" y="418" width="267" height="60" rx="9" fill="#e7f3ef" stroke="#e7f3ef"/>
<text x="513.5" y="455" font-size="20" fill="#157466" font-weight="550" text-anchor="middle" >Reproduce the failure</text>
