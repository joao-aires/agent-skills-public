<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110" role="img" aria-labelledby="title desc">
<title id="title">Different starting points through the same development toolkit</title>
<desc id="desc">Six representative paths show new product development, existing features, bug repair, read-only assessment, operations and specialist work. Each path uses the relevant lifecycle activities and can stop at the requested outcome. People and trusted automation use the same activities; the host supplies tools, credentials and limits. Supporting guidance applies according to context, without automatically invoking explicit-only workflows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315f91"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#157466"/></marker></defs>
<rect width="1600" height="1110" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif">
<text x="44" y="59" font-size="34" fill="#172c41" font-weight="700" text-anchor="start" >Different starting points. The same discipline.</text>
<text x="44" y="96" font-size="23" fill="#52667a" font-weight="400" text-anchor="start" >Green labels show example direct requests; the steps describe outcomes.</text>
<rect x="44" y="145" width="1512" height="108" rx="12" fill="white" stroke="#c5d2df"/>
<text x="66" y="183" font-size="24" fill="#172c41" font-weight="700" text-anchor="start" >A new product</text>
<g data-skill="true" data-use="direct"><rect x="58" y="194.0" width="280" height="34" rx="5" fill="#e7f3ef" stroke="#a4c9b4"/><text x="66" y="220" font-size="20" fill="#176044" font-weight="400" text-anchor="start" >develop</text></g>
<rect x="380" y="170" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="513.5" y="207" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Shape product direction</text>
<path d="M649 200 H662" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="668" y="170" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="801.5" y="207" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Design the system &amp; UX</text>
<path d="M937 200 H950" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="956" y="170" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="1089.5" y="207" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Implement ↔ verify</text>
<path d="M1225 200 H1238" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1244" y="170" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="1377.5" y="207" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Deliver &amp; learn</text>
<rect x="44" y="269" width="1512" height="108" rx="12" fill="white" stroke="#c5d2df"/>
<text x="66" y="307" font-size="24" fill="#172c41" font-weight="700" text-anchor="start" >An existing feature</text>
<g data-skill="true" data-use="direct"><rect x="58" y="318.0" width="280" height="34" rx="5" fill="#e7f3ef" stroke="#a4c9b4"/><text x="66" y="344" font-size="20" fill="#176044" font-weight="400" text-anchor="start" >develop / implement</text></g>
<rect x="380" y="294" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="513.5" y="331" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Inspect accepted context</text>
<path d="M649 324 H662" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="668" y="294" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="801.5" y="331" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Resolve decisions</text>
