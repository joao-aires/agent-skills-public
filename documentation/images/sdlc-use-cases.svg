<text x="66" y="803" font-size="24" fill="#172c41" font-weight="700" text-anchor="start" >A specialist question</text>
<g data-skill="true" data-use="direct"><rect x="58" y="814.0" width="280" height="34" rx="5" fill="#e7f3ef" stroke="#a4c9b4"/><text x="66" y="840" font-size="20" fill="#176044" font-weight="400" text-anchor="start" >product-management</text></g>
<rect x="380" y="790" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="513.5" y="827" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Bound the question</text>
<path d="M649 820 H662" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="668" y="790" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="801.5" y="827" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Select relevant expertise</text>
<path d="M937 820 H950" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="956" y="790" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="1089.5" y="827" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Investigate or create</text>
<path d="M1225 820 H1238" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1244" y="790" width="267" height="60" rx="9" fill="#eaf1f8" stroke="#eaf1f8"/>
<text x="1377.5" y="827" font-size="20" fill="#315f91" font-weight="550" text-anchor="middle" >Return the scoped result</text>
<text x="44" y="939" font-size="24" fill="#172c41" font-weight="700" text-anchor="start" >Across every path</text>
<text x="44" y="975" font-size="22" fill="#52667a" font-weight="400" text-anchor="start" >Choose expertise by capability. Preserve accepted decisions, scope and evidence when specialists are absent.</text>
<text x="44" y="1014" font-size="21" fill="#52667a" font-weight="400" text-anchor="start" >People and trusted automation use the same activities; the host supplies tools, credentials and execution limits.</text>
<text x="44" y="1053" font-size="21" fill="#52667a" font-weight="400" text-anchor="start" >Direct specialist use does not require a full SDLC run. Explicit-only workflows start only when requested.</text>
</g></svg>
