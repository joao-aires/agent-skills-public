<text x="1044" y="922" font-size="14.4" fill="#836746"  >Issue  ·  actionable investigation or change, with acceptance</text>
<text x="1044" y="952" font-size="14.4" fill="#836746"  >PR  ·  actual change, checks, deviation, risks</text>
<text x="1044" y="985" font-size="14" fill="#957953"  >Summaries link to ECR; they never replace it.</text>
