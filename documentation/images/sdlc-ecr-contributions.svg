<text x="54" y="52" font-size="30" fill="#142c47" font-weight="700" >From SDLC phase to engineering artifact</text>
<text x="54" y="82" font-size="15" fill="#536e8b"  >Each phase updates a specific part of one evolving change record — without duplicating canonical application knowledge.</text>
