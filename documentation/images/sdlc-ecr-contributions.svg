<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1095" viewBox="0 0 1600 1095" role="img" aria-labelledby="title description">
<title id="title">SDLC phases and their direct engineering artifact handoffs</title>
<desc id="description">Seven SDLC phases contribute to one Engineering Change Record. Plan contributes scope and feasibility and can link a brief, PRD or roadmap. Issues and pull requests project information for implementers and reviewers. Current architecture stays with the application.</desc>
