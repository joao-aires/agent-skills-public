<text x="77" y="952" font-size="14.5" fill="#4d7869"  >Code · tests · accepted ADRs · contracts · runbooks</text>
<text x="77" y="985" font-size="14" fill="#4d7869"  >Only evidenced implementation updates canonical current-state views.</text>
