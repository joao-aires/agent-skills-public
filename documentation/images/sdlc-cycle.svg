<text x="1290.0" y="166" text-anchor="middle" font-size="14" fill="#526580">Product feedback</text>
<path d="M 809.7 278.0 Q 820.9 279.8 829.2 287.4" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
