<text x="710" y="215" text-anchor="middle" font-size="14" font-weight="400" fill="#354966" >Includes: onboarding, local setup, linting, tests and containers.</text>
<text x="710" y="236" text-anchor="middle" font-size="14" font-weight="400" fill="#354966" >Delivery: CI/CD, artifacts, release and recovery procedures.</text>
