<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1360" role="img" aria-labelledby="title desc">
<title id="title">Project foundations, the SDLC cycle and skills across the lifecycle</title>
<desc id="desc">Establish project foundations after sufficient product and architecture decisions, then maintain them throughout the cycle. Product discovery and priorities feed planning, with business strategy supporting unresolved business direction. The SDLC cycles through planning, requirements analysis, design, implementation, testing, deployment and maintenance. Testing loops back to implementation for repair and rechecking. Design includes architecture, experience, visual direction and contracts. Detailed implementation planning follows those decisions. Live product feedback informs discovery and the next development cycle; evidence can reopen any affected decision. Each card explains its purpose in plain language; separate Skill labels name user-facing entry points, not plugins. Planning uses product-management for goals and priorities; refine owns detailed requirements, and plan sequences implementation after design. Skills shown are representative; research, explicit clarification, documentation, Git, security, reliability and observability support discovery, development and feedback.</desc>
