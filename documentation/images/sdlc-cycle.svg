<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Product discovery, the SDLC cycle and product feedback</title>
<desc id="desc">Discovery feeds planning. The SDLC cycles through planning, requirements analysis, design, implementation, testing, deployment and maintenance. Live product feedback informs discovery and the next development cycle. Skills shown are representative; documentation, Git and security support all phases.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526580"/></marker></defs>
