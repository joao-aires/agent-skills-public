<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="48" font-size="26" font-weight="700" fill="#15233b">From product evidence to software — and back</text>
<text x="40" y="78" font-size="15" fill="#526580">Representative skill entry points · Choose only what the task needs</text>
<rect x="20" y="110" width="240" height="820" rx="18" fill="#e8f5ef" stroke="#cbd5e1"/>
<text x="140.0" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#15233b">Before development</text>
<text x="140.0" y="166" text-anchor="middle" font-size="14" fill="#526580">Product discovery</text>
<rect x="280" y="110" width="860" height="820" rx="18" fill="#eef2ff" stroke="#cbd5e1"/>
