<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="753" viewBox="0 0 1540 753" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">Engineering artifacts and roles across the SDLC</title>
<desc id="desc">Seven phase columns align optional handoff artifacts, one continuous ECR and six overlapping role rows. Issues and PRs are audience views. Project evidence can reopen earlier decisions.</desc>
<rect x="0" y="0" width="1540" height="753" rx="0" fill="#f5f8fc" stroke="none"/>
<text x="28" y="47" font-size="30" fill="#172c49" font-weight="700" text-anchor="start">Engineering artifacts and roles across the SDLC</text>
<text x="28" y="74" font-size="16" fill="#475a71" font-weight="400" text-anchor="start">One change record follows the work. Each phase contributes an outcome, a decision or a link to its evidence.</text>
