<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1095" viewBox="0 0 1600 1095" role="img" aria-labelledby="title description">
<title id="title">SDLC phases and their direct engineering artifact handoffs</title>
<desc id="description">Seven SDLC phase cards each have an individual vertical arrow to their specific contribution in one shared Engineering Change Record: requirements, proposed design/C4 diagrams, implementation strategy, implementation evidence, verification, release evidence and operational learning. All stages also update record lifecycle status and decision history. The record is stored in an authorized filesystem or external document workspace separate from the application repository. Current architecture stays in the application repository. Optional issues and pull requests are audience-specific views.</desc>
