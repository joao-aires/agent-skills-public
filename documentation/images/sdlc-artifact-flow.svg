<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">SDLC artifacts: phase outputs, change record, code baseline and audience views</title>
<desc id="desc">Seven SDLC phases produce outcomes in the same evolving Engineering Change Record, stored outside the application repository in authorized filesystem or optional provider storage. Current-state architecture C4 and sequences in the application repository inform the design; proposed target diagrams stay in the change record and are reconciled with implemented code. Issue and PR descriptions are audience-specific views.</desc>
