<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
<title id="title">Engineering SDLC artifact flow</title>
<desc id="description">Seven engineering phases form an iterative cycle and maintain one standard seven-section engineering change record in an external-to-code engineering workspace. Product context informs changes. The ECR references current application architecture, while accepted and implemented changes reconcile canonical C4 diagrams, decisions and sequences in the application repository. Optional issues and pull requests are audience-specific summaries.</desc>
